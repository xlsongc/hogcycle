# What each series is, for a reader. Travels in the contract in both
# languages, like the names (ADR-0014): a description written on the frontend
# would be free to drift from the caliber the backend collects.
#
# `publisher` is who stands behind the number, and the source we reach when
# that is a different party (a mirror). `url` is the page a reader can check;
# null when the only address we have is an API, never a guessed page.
# Collection details, quirks and history stay in sources.yaml `notes`.
#
# Every indicator in sources.yaml and every derived series in gold needs an
# entry. A missing one fails the export.

series:
  sow_inventory:
    publisher:
      zh: 国家统计局季度调查，农业农村部等五部委月度联合发布
      en: National Bureau of Statistics quarterly survey, in the five-ministry monthly release
    url: https://www.moa.gov.cn/ztzl/szcpxx/jdsj/
    about:
      zh: 正在生产仔猪的母猪头数。生物学把它和 10–12 个月后的生猪出栏钉在一起，是猪周期里唯一真正的先行指标。季末数来自统计局调查；2025 年底起只公开季末数。
      en: The number of sows actively producing piglets. Biology ties it to hog supply 10–12 months later, which makes it the cycle's one real leading indicator. Quarter-end figures come from the statistics bureau's survey; since late 2025 only those are published.

  hog_inventory:
    publisher:
      zh: 国家统计局季度调查，农业农村部等五部委月度联合发布
      en: National Bureau of Statistics quarterly survey, in the five-ministry monthly release
    url: https://www.moa.gov.cn/ztzl/szcpxx/jdsj/
    about:
      zh: 季末存栏的全部生猪。它把十个月前的母猪决策和眼下的压栏行为混在一起，所以不是先行指标。
      en: All hogs on hand at quarter end. It mixes sow decisions from ten months earlier with farmers holding hogs back now, so it does not lead.

  slaughter:
    publisher:
      zh: 农业农村部定点屠宰企业统计，五部委月度联合发布
      en: MARA designated-slaughterhouse statistics, in the five-ministry monthly release
    url: https://www.moa.gov.cn/ztzl/szcpxx/jdsj/
    about:
      zh: 全部定点屠宰企业当月屠宰的生猪头数，2025 年 7 月起的口径。是产能最终落地成供给的那一端。
      en: Hogs slaughtered in a month by all designated plants, on the caliber in force since July 2025. It is where capacity finally lands as supply.

  slaughter_above_scale:
    publisher:
      zh: 农业农村部定点屠宰企业统计，五部委月度联合发布
      en: MARA designated-slaughterhouse statistics, in the five-ministry monthly release
    url: https://www.moa.gov.cn/ztzl/szcpxx/jdsj/
    about:
      zh: 规模以上定点屠宰企业的月屠宰量。2025 年 7 月统计扩大到全部定点企业后这个口径不再发布，作为历史保留。
      en: Monthly slaughter by plants above designated size. The caliber stopped when the statistics widened to every designated plant in July 2025; it is kept as history.

  piglet_price:
    publisher:
      zh: 农业农村部畜牧兽医局，500 个县集贸市场周度监测
      en: MARA Animal Husbandry and Veterinary Bureau, weekly 500-county market survey
    url: https://xmsyj.moa.gov.cn/jcyj/
    about:
      zh: 仔猪的全国平均价格，元/公斤。是养殖户补栏意愿的即时报价，比母猪存栏更早也更干净。
      en: The national average piglet price per kilogram. It quotes farmers' willingness to restock in real time, sooner and more cleanly than the sow count.

  piglet_price_monthly:
    publisher:
      zh: 农业农村部 500 个县集贸市场监测，五部委月度联合发布
      en: MARA 500-county market survey, in the five-ministry monthly release
    url: https://www.moa.gov.cn/ztzl/szcpxx/jdsj/
    about:
      zh: 与周度仔猪价格同一套调查的月均值。粒度不同就是另一个指标，所以单独成格。
      en: The monthly mean of the same survey as the weekly piglet price. A different granularity is a different indicator, so it has its own panel.

  sow_binary_price:
    publisher:
      zh: 国家发展改革委价格监测中心，五部委月度联合发布
      en: NDRC Price Monitoring Center, in the five-ministry monthly release
    url: https://www.moa.gov.cn/ztzl/szcpxx/jdsj/
    about:
      zh: 二元后备母猪的销售价格。母猪补栏的成本，也是行业对未来猪价预期的一个读数。
      en: The sale price of crossbred replacement gilts. It is what restocking sows costs, and one reading of what the trade expects of future hog prices.

  corn_price:
    publisher:
      zh: 玄田数据（第三方镜像，经 akshare）
      en: Xuantian Data (a third-party mirror, via akshare)
    url: null
    about:
      zh: 玉米日度价格，元/吨。上游只保留约一年的滚动窗口，更早的数据只存在于本仓库每天的采集里。
      en: Daily corn price per tonne. Upstream keeps a rolling window of about a year; anything older exists only in this warehouse's daily collection.

  hog_corn_ratio:
    publisher:
      zh: 国家发展改革委价格监测中心（经玄田数据镜像）
      en: NDRC Price Monitoring Center (via the Xuantian Data mirror)
    url: https://www.chinaprice.cn/
    about:
      zh: 生猪出场价与玉米批发价之比，官方调控预案的口径。镜像 2026 年 8 月停更；发改委只以图片发布，暂无可机读的一手来源。
      en: Hog ex-farm price over corn wholesale price, the caliber the official regulation plan uses. The mirror stopped in August 2026, and the NDRC publishes only images, so there is no machine-readable primary source yet.

  corn_price_county:
    publisher:
      zh: 农业农村部畜牧兽医局，500 个县集贸市场周度监测
      en: MARA Animal Husbandry and Veterinary Bureau, weekly 500-county market survey
    url: https://xmsyj.moa.gov.cn/jcyj/
    about:
      zh: 500 县集贸市场的玉米平均价格，元/公斤，和同一份周报里的生猪价同一个采集日。
      en: Average corn price in the 500-county markets, per kilogram, collected on the same day as the hog price in the same weekly report.

  feed_price_county:
    publisher:
      zh: 农业农村部畜牧兽医局，500 个县集贸市场周度监测
      en: MARA Animal Husbandry and Veterinary Bureau, weekly 500-county market survey
    url: https://xmsyj.moa.gov.cn/jcyj/
    about:
      zh: 育肥猪配合饲料的平均价格，元/公斤。养一头猪最大的一笔成本。
      en: Average price of finishing-hog compound feed per kilogram, the largest single cost of raising a hog.

  scale_profit_per_head:
    publisher:
      zh: 农业农村部等五部委月度联合发布（表中未注明由哪个部门编制）
      en: The five-ministry monthly release (the table does not say which agency compiles it)
    url: https://www.moa.gov.cn/ztzl/szcpxx/jdsj/
    about:
      zh: 规模养殖场每出栏一头猪的净利润，元/头，负值是亏损。联合发布在 2025 年 8 月那期之后不再刊出，所以这是一段已结束的历史。
      en: Net profit per hog sold by scale farms, in yuan per head; negative is a loss. The joint release stopped printing it after the August 2025 edition, so this is a finished history.

  backyard_profit_per_head:
    publisher:
      zh: 农业农村部等五部委月度联合发布（表中未注明由哪个部门编制）
      en: The five-ministry monthly release (the table does not say which agency compiles it)
    url: https://www.moa.gov.cn/ztzl/szcpxx/jdsj/
    about:
      zh: 散养户每出栏一头猪的净利润，元/头，负值是亏损，与规模养殖那一行并列印出。两条的差就是规模化的成本优势。2025 年 8 月那期之后不再刊出。
      en: Net profit per hog sold by backyard farms, in yuan per head; negative is a loss. It is printed beside the scale-farm row, and the gap between the two is what scale saves. Not printed after the August 2025 edition.

  scale_cost_per_head:
    publisher:
      zh: 农业农村部等五部委月度联合发布（表中未注明由哪个部门编制）
      en: The five-ministry monthly release (the table does not say which agency compiles it)
    url: https://www.moa.gov.cn/ztzl/szcpxx/jdsj/
    about:
      zh: 规模养殖场每出栏一头猪的总成本，元/头。与每头净利润出自同一张表。联合发布在 2025 年 8 月那期之后不再刊出。
      en: Total cost per hog sold by scale farms, in yuan per head, from the same table as the net profit. The joint release stopped printing it after the August 2025 edition.

  soymeal_price_county:
    publisher:
      zh: 农业农村部畜牧兽医局，500 个县集贸市场周度监测
      en: MARA Animal Husbandry and Veterinary Bureau, weekly 500-county market survey
    url: https://xmsyj.moa.gov.cn/jcyj/
    about:
      zh: 豆粕的平均价格，元/公斤。饲料里的蛋白原料，和玉米一起决定配合饲料的成本。与玉米、饲料价格出自同一份周报、同一采集日。
      en: Average price of soybean meal per kilogram, the protein in hog feed. With corn it sets what compound feed costs. Same weekly report and collection day as the corn and feed prices.

  hog_corn_ratio_county:
    publisher:
      zh: 由本项目计算，分子分母均来自农业农村部 500 县集贸市场周报
      en: Computed here, from two prices in MARA's weekly 500-county report
    url: https://xmsyj.moa.gov.cn/jcyj/
    about:
      zh: 同一份周报、同一采集日的生猪价 ÷ 玉米价。与发改委口径相关 0.996，平均低 0.26，所以不画发改委的 5:1 线。
      en: Hog price over corn price, from the same weekly report and the same collection day. It correlates 0.996 with the NDRC ratio but runs 0.26 lower on average, so the NDRC's 5:1 line is not drawn on it.

  profit_per_head_est:
    publisher:
      zh: 本项目估算，输入为农业农村部 500 县周报的生猪、育肥猪饲料和仔猪价格，以五部委月度联合发布的规模养殖成本与净利润（2021-12 至 2025-08）校准
      en: Estimated here, from the hog, fattening-feed and piglet prices in MARA's weekly 500-county report, calibrated on the joint release's scale-farm cost and profit (2021-12 to 2025-08)
    url: https://xmsyj.moa.gov.cn/jcyj/
    about:
      zh: 估算值，不是官方数。官方的规模养殖每头净利润在 2025 年 8 月那期之后停发；这里用仍在公布的周度价格把它接下去。成本 = 常数 + 系数 × 13 周前的饲料价 + 系数 × 13 周前的仔猪价，收入 = 校准系数 × 当周生猪价，系数用两者重叠的月份拟合，每次导出重新拟合。上线前做过样本外检验：用前 24、28 或 32 个月拟合、预测其余月份，误差约 45–51 元/头（官方值的波动约 ±388），相关 0.93–0.98，盈亏方向 94–100% 一致。
      en: An estimate, not an official figure. The official scale-farm profit per hog stopped after the 2025-08 edition; this carries it forward from weekly prices that are still published. Cost = a constant + a coefficient × the feed price 13 weeks earlier + a coefficient × the piglet price 13 weeks earlier; revenue = a calibrated factor × this week's hog price. The coefficients are fitted on the months both exist, again at every export. Tested out of sample before it went up — fitted on the first 24, 28 or 32 months and predicting the rest — it was off by about 45–51 CNY per hog on a series that swings ±388, correlated 0.93–0.98, and called profit or loss right in 94–100% of months.

  breakeven_price_est:
    publisher:
      zh: 本项目估算，与「每头净利润（规模养殖，估算）」同一个模型
      en: Estimated here, by the same model as the estimated net profit per hog
    url: https://xmsyj.moa.gov.cn/jcyj/
    about:
      zh: 估算的成本 ÷ 校准系数：500 县生猪价要到多少，规模养殖场才不赚不亏。和 500 县生猪价同一口径，可以在对比页上与它画在同一条轴上；价格在它下面就是亏损。估算值，不是官方数，方法与误差见每头净利润估算。
      en: Estimated cost over the calibrated factor, the 500-county hog price at which a scale farm neither earns nor loses. It is on the 500-county price's caliber, so it can share an axis with that price on the compare page; a price below it is a loss. An estimate, not an official figure; the method and its error are on the estimated profit's page.

  lh_futures_main:
    publisher:
      zh: 大连商品交易所生猪期货，经新浪财经镜像（交易所接口拒绝本项目访问）
      en: Dalian Commodity Exchange live hog futures, via Sina Finance's copy (the exchange's own endpoint refuses this project)
    url: https://www.dce.com.cn/
    about:
      zh: 持仓最多的那个合约每天的结算价，接成一条线。它是市场用钱下注的预期，不是测量，所以不上图表墙。换主力合约时线会跳，那是换了交割月。元/吨，交割标准品口径，和现货的元/公斤不是一回事。
      en: The settle of whichever contract has the most open interest each day, joined into one line. It is an expectation the market puts money behind, not a measurement, so it stays off the wall. The line jumps when the main contract rolls to a new delivery month. CNY per tonne of the delivery grade, not the same caliber as spot prices in CNY per kg.

  lh_futures_curve:
    publisher:
      zh: 大连商品交易所生猪期货，经新浪财经镜像，逐个合约读取
      en: Dalian Commodity Exchange live hog futures, via Sina Finance's copy, read one contract at a time
    url: https://www.dce.com.cn/
    about:
      zh: 每个在挂合约的最新结算价，按交割月排开：市场此刻给未来每个月的猪定的价。它是市场的预期，不是本项目的预测。每个交易日都重新定价，本仓库记下每一天的曲线。元/吨。
      en: The latest settle of every listed contract, laid out by delivery month — what the market prices hogs at for each coming month, right now. The market's expectation, not this project's forecast. Re-priced every trading day, and this warehouse keeps the curve as it stood each day. CNY per tonne.

  hog_price_ndrc:
    publisher:
      zh: 国家发展改革委价格监测中心，五部委月度联合发布
      en: NDRC Price Monitoring Center, in the five-ministry monthly release
    url: https://www.moa.gov.cn/ztzl/szcpxx/jdsj/
    about:
      zh: 主产区定点养殖场的生猪出场价，月度。发改委的猪粮比价就是这个价格除以玉米批发价，5:1 那条线定义在它上面。与其他四套猪价是不同的测量。
      en: The price hogs leave designated farms at in the main producing regions, monthly. The NDRC's hog-to-corn ratio is this price over the corn wholesale price, so the 5:1 line is defined on it. A different measurement from the other four hog prices.

  hog_output_ytd:
    publisher:
      zh: 国家统计局，五部委月度联合发布
      en: National Bureau of Statistics, in the five-ministry monthly release
    url: https://www.moa.gov.cn/ztzl/szcpxx/jdsj/
    about:
      zh: 从 1 月 1 日累计到所注季末的生猪出栏头数，统计局只按这种累计数公布。每年 1 月归零，所以不上图表墙，单季数见「生猪出栏（单季）」。
      en: Hogs marketed from 1 January to the quarter end shown, which is the only form the statistics bureau publishes. It resets every January, so it stays off the wall; see the per-quarter series.

  pork_output_ytd:
    publisher:
      zh: 国家统计局，五部委月度联合发布
      en: National Bureau of Statistics, in the five-ministry monthly release
    url: https://www.moa.gov.cn/ztzl/szcpxx/jdsj/
    about:
      zh: 从 1 月 1 日累计到所注季末的猪肉产量，万吨。与生猪出栏同表，同样每年 1 月归零。
      en: Pork produced from 1 January to the quarter end shown, in 10,000 tonnes. From the same table as hogs marketed, and it resets every January too.

  hog_output_quarter:
    publisher:
      zh: 由本项目计算，相邻两个统计局年内累计数相减
      en: Computed here, as the difference of two of the statistics bureau's year-to-date totals
    url: https://www.moa.gov.cn/ztzl/szcpxx/jdsj/
    about:
      zh: 一个季度出栏的生猪头数。一季度就是印出的数；之后每季是到本季末的累计减到上季末的累计。两个累计数都印过才算，缺一个就留空。这是 10–12 个月前能繁母猪落到供给上的那一端。
      en: Hogs marketed in one quarter. The first quarter is the printed figure; each later quarter is the total to its end less the total to the end of the one before, computed only when both were printed. It is where the sow herd of 10–12 months earlier arrives as supply.

  pork_output_quarter:
    publisher:
      zh: 由本项目计算，相邻两个统计局年内累计数相减
      en: Computed here, as the difference of two of the statistics bureau's year-to-date totals
    url: https://www.moa.gov.cn/ztzl/szcpxx/jdsj/
    about:
      zh: 一个季度的猪肉产量，万吨，算法同单季出栏。它与出栏之比随出栏体重变化。
      en: Pork produced in one quarter, in 10,000 tonnes, computed as for hogs marketed. Its ratio to hogs marketed moves with slaughter weight.

  hog_price_index:
    publisher:
      zh: 行情宝平台成交数据（经 akshare）
      en: Hangqingbao platform transactions (via akshare)
    url: null
    about:
      zh: 行情宝平台上生猪的平均成交价，2015 年起，是本项目历史最长的猪价序列，周期定位以它为骨架。
      en: The average price of hogs traded on the Hangqingbao platform since 2015. It is the longest hog-price history here, and the one the cycle is positioned against.

  hog_price_wai3:
    publisher:
      zh: 玄田数据（第三方镜像，经 akshare）
      en: Xuantian Data (a third-party mirror, via akshare)
    url: null
    about:
      zh: 外三元生猪的日度出栏均价。与平台成交价、500 县集贸价是三种不同的测量，各自一格。上游只保留约一年。
      en: The daily ex-farm price of three-way crossbred hogs. It, the platform transaction price and the 500-county price are three different measurements, each in its own panel. Upstream keeps about a year.

  hog_price_county:
    publisher:
      zh: 农业农村部畜牧兽医局，500 个县集贸市场周度监测
      en: MARA Animal Husbandry and Veterinary Bureau, weekly 500-county market survey
    url: https://xmsyj.moa.gov.cn/jcyj/
    about:
      zh: 500 县集贸市场和采集点的生猪平均价格，元/公斤。政府自己的猪价口径，2021 年 12 月起有周度历史。
      en: The average hog price across the 500-county markets and collection points, per kilogram. It is the government's own hog-price caliber, with weekly history from December 2021.

  carcass_price:
    publisher:
      zh: 农业农村部畜牧兽医局，定点屠宰企业周度监测
      en: MARA Animal Husbandry and Veterinary Bureau, weekly designated-slaughterhouse survey
    url: https://xmsyj.moa.gov.cn/jcyj/
    about:
      zh: 定点屠宰企业白条肉的平均出厂价。猪价从屠宰端出去时的价格；2024 年 1 月起覆盖全部定点企业。
      en: The average ex-plant price of carcass pork at designated slaughterhouses, the price as it leaves slaughter. It covers every designated plant from January 2024.

  carcass_price_above_scale:
    publisher:
      zh: 农业农村部屠宰监测（经玄田数据镜像）
      en: MARA slaughter survey (via the Xuantian Data mirror)
    url: null
    about:
      zh: 2024 年以前规模以上定点屠宰企业的白条肉出厂价。调查对象变了之后另成一个口径，作为历史保留。
      en: The carcass ex-plant price at plants above designated size, before 2024. Once the survey changed whom it asks, this became a separate caliber, kept as history.

  meat_price_index:
    publisher:
      zh: 玄田数据（第三方镜像，经 akshare）
      en: Xuantian Data (a third-party mirror, via akshare)
    url: null
    about:
      zh: 跨肉类的相对价格指数，用来判断猪肉是独立行情还是普涨。镜像 2025 年 10 月停更，已封存。
      en: A cross-meat relative price index, for telling a pork-only move from a general one. The mirror stopped in October 2025, and the series is retired.

  pork_price_county:
    publisher:
      zh: 农业农村部畜牧兽医局，500 个县集贸市场周度监测
      en: MARA Animal Husbandry and Veterinary Bureau, weekly 500-county market survey
    url: https://xmsyj.moa.gov.cn/jcyj/
    about:
      zh: 500 县集贸市场的猪肉平均价格，元/公斤。与同一份周报、同一采集日的生猪价格放在一起，读的是同一批市场里从生猪到猪肉的价差。
      en: The average price of pork across the 500-county markets, per kilogram. Read beside the hog price from the same weekly report and collection day, it gives the step from live hog to pork in the same markets.

  pork_retail_price:
    publisher:
      zh: 国家发展改革委 36 个大中城市监测，五部委月度联合发布
      en: NDRC 36-city monitoring, in the five-ministry monthly release
    url: https://www.moa.gov.cn/ztzl/szcpxx/jdsj/
    about:
      zh: 36 个大中城市精瘦肉的零售价。它是零售端的猪肉，不是生猪，所以结构性地高于出厂价。
      en: The retail price of lean pork in 36 large and mid-sized cities. It prices pork at retail, not live hogs, so it sits structurally above the ex-plant price.

  offal_imports:
    publisher:
      zh: 海关总署，经农业农村部等五部委月度联合发布
      en: General Administration of Customs, in the five-ministry monthly release
    url: https://www.moa.gov.cn/ztzl/szcpxx/jdsj/
    about:
      zh: 每月进口的猪杂碎（内脏、蹄、头等），万吨。量与猪肉进口相当，但多进餐饮和加工，对猪价的缓冲更弱。同样没有单独的 1 月数。
      en: Pork offal (organs, feet, heads) imported each month, in 10,000 tonnes. The volume is close to pork's, but it mostly goes to restaurants and processing, so it cushions hog prices less. There is no January figure of its own here either.

  pork_imports:
    publisher:
      zh: 海关总署，经农业农村部等五部委月度联合发布
      en: General Administration of Customs, in the five-ministry monthly release
    url: https://www.moa.gov.cn/ztzl/szcpxx/jdsj/
    about:
      zh: 每月进口的猪肉，万吨。国内猪价高时进口增加，是供给的缓冲，不改变周期本身。海关把 1、2 月合并公布，所以每年没有单独的 1 月数。
      en: Pork imported each month, in 10,000 tonnes. Imports rise when domestic prices are high, a buffer on supply rather than a driver of the cycle. Customs reports January and February together, so there is no January figure of its own.

  hog_weight:
    publisher:
      zh: 行情宝平台成交数据（经 akshare）
      en: Hangqingbao platform transactions (via akshare)
    url: null
    about:
      zh: 平台成交生猪的平均体重。压栏和二次育肥让它短期起伏，影响股价多于影响周期。
      en: The average weight of hogs traded on the platform. Holding hogs back and re-fattening move it in the short run; it moves share prices more than the cycle.

  eq_muyuan:
    publisher: {zh: 深圳证券交易所日线，后复权（经 akshare / 新浪财经）, en: Shenzhen Stock Exchange daily close, back-adjusted (via akshare / Sina Finance)}
    url: null
    about:
      zh: 牧原股份的后复权日收盘价。股价是对周期的索取权，不是周期的一环，只出现在对比页。
      en: Muyuan Foods' back-adjusted daily close. A share price is a claim on the cycle rather than a link in it, so it appears only in Compare.

