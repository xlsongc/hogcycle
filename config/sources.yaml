# Adding an indicator should be a config change, not a code change.
#
# tier follows the causal chain:
#   capacity  能繁母猪 → (10-12m) → 商品猪出栏   真正的先行指标
#   margin    盈亏，决定去化会不会持续
#   price     被预测的结果本身，不是驱动因素
#   noise     短期供需扰动，影响股价不影响周期
#
# lo/hi are tripwires for unit drift and upstream parser breaks, not
# forecasts. Set them roughly 3x wider than any plausible move.
#
# extract 只在源不是 akshare 惯例的 date/value 窄表时才需要写。默认值就是
# date/value —— 那是一个明确约定，不是模糊猜测。之前那份靠全局候选列名猜列的
# 实现，正是 sow_inventory 静默采不进来的根因。
#
# freq 是「裸日期标签」的兜底粒度。带中文期间标签的行（2009 / 2025年7月 /
# 2025年一季度（末） / 2018年第01周）由标签自己决定粒度，逐行记录。

indicators:

  # ---------- capacity：真正的先行指标 ----------

  - id: sow_inventory
    name_zh: 能繁母猪存栏
    tier: capacity
    freq: monthly
    unit: 万头
    lo: 1000.0
    hi: 10000.0
    adapter: moa
    call: {fn: moa_hog_release}
    extract: {value: 能繁母猪存栏}
    revises: true
    # 公开口径 2025 年底由月频转季频：季度末印出后要等下一个季度才有新值，
    # 最新 obs_date 会合法地老化到 110 天以上。按 monthly 的 100 天默认阈值
    # 会在每年 10 月中旬误报，所以这里显式放宽 —— 而不是把默认值调松。
    max_age_days: 150
    notes: >
      唯一会被回溯修订的序列，也是唯一真正的先行指标 —— 这两件事同时成立，
      正是 bitemporal 存储存在的理由。
      2026-09 从 akshare 换源到农业农村部。原路径的上游是玄田数据这个第三方
      镜像，2025年10月起停更却继续供应旧数据，采集器每天照报 ok，序列静默
      冻结了 11 个月。详见 docs/adr/0013。
      现源为农业农村部、发改委、商务部、海关总署、国家统计局联合发布的
      《生猪产品数据》，每月一期 XLSX。粒度逐行记录，不可拉成一条平滑曲线
      冒充等价测量：
        2009-2020 年度值 —— 仍是玄田快照，保存在 bronze，不再有活源
        2021-12 至 2025-10 月频 —— 非季度末月份由农业农村部定点监测的环比
                                   变化率，以统计局季度末数为基数推算
        2026 起 季频 —— 公开口径改为只发季度末的统计局数
      对本序列，granularity 恰好编码了口径。
      正常保有量基准值本身也会调整（4100 → 3900 → 3750，末次调整见
      《生猪产能综合调控实施方案（2026年修订）》），做同比或缺口计算时必须用
      当期基准，不能用今天的。每期发布都写明「相当于正常保有量的 X%」，所以
      当期基准是可以从原文反推的 —— 但那是 gold 层的事，silver 只存原值。

  - id: hog_inventory
    name_zh: 生猪存栏
    tier: capacity
    freq: quarterly
    unit: 万头
    lo: 10000.0
    hi: 100000.0
    adapter: moa
    call: {fn: moa_hog_release}
    extract: {value: 生猪存栏}
    revises: true
    max_age_days: 150
    notes: >
      总栏舍占用，不是先行指标 —— 它把 10-12 个月前的母猪决策和眼前的压栏
      行为混在一起。放在 capacity 层是因为它和能繁母猪同源同表、同为统计局
      季度调查监测数，读的时候要清楚：领先性来自母猪那条线，不是这条。

  - id: slaughter
    name_zh: 定点屠宰量（全口径）
    tier: capacity
    freq: monthly
    unit: 万头
    lo: 100.0
    hi: 20000.0
    adapter: moa
    call: {fn: moa_hog_release}
    extract: {value: 生猪定点屠宰企业屠宰量}
    notes: >
      月频出栏的近似 —— 产能兑现为供给的那一步，也是这套数据里唯一月频的
      供给侧实测量。2025年7月起的新口径，覆盖全国生猪定点屠宰企业。
      与 slaughter_above_scale 是两个指标而不是一条线：2025年7月覆盖面
      扩大，绝对值随之跳升，接在一起会凭空造出一次「供给暴增」。官方自己的
      同比环比也按可比口径另算。

  - id: slaughter_above_scale
    name_zh: 定点屠宰量（规模以上）
    tier: capacity
    freq: monthly
    unit: 万头
    lo: 100.0
    hi: 20000.0
    adapter: moa
    call: {fn: moa_hog_release}
    extract: {value: 规模以上生猪定点屠宰企业屠宰量}
    # 2025年7月起上游不再发布这个口径。序列到此为止 —— 它是完成了，不是冻住
    # 了，所以「采不到」是预期而非故障：不报错、不算陈旧、不上图表墙。
    retired: true
    notes: >
      2025年6月及以前的旧口径，只覆盖规模以上企业，因此系统性低于全口径。
      保留它是因为它提供 2021-12 至 2025-06 的月频供给史；不可与 slaughter
      接成一条曲线。

  - id: piglet_price
    name_zh: 仔猪价格
    tier: capacity
    freq: weekly
    unit: CNY/kg
    lo: 5.0
    hi: 200.0
    adapter: akshare
    call: {fn: futures_hog_cost, symbol: 仔猪价格}
    notes: >
      补栏意愿的价格表达，是产能层里最灵敏的一个。它是日频市场定价、永不修订，
      在「养殖户想不想补栏」这件事上比能繁母猪存栏更早也更干净 —— 母猪存栏是
      补栏行为的结果，仔猪价是补栏意愿的即时报价。
      注意源站按公斤报价，而行业新闻常按元/头报 7kg 断奶仔猪 —— 换算前先确认
      体重口径。

  - id: sow_binary_price
    name_zh: 二元母猪价格
    tier: capacity
    freq: monthly
    unit: CNY/kg
    lo: 5.0
    hi: 200.0
    adapter: moa
    call: {fn: moa_hog_release}
    extract: {value: 全国二元母猪销售价格}
    notes: >
      后备产能的价格表达。发改委价格监测中心数据，覆盖全国生猪主产区的定点
      采报单位。
      2026-09 由 akshare（玄田镜像）换到农业农村部联合发布。两边同期数值逐位
      相同 —— 玄田一直转的就是这套发改委数，但它落后一个月，而陈旧度守卫上线
      当天就把这条也点了出来。原 freq 标为 weekly 是错的：源头给的是月末日期，
      月频。历史行仍保留在 silver，粒度按当时解析结果记为 weekly。

  # ---------- margin：决定去化会不会持续 ----------

  - id: corn_price
    name_zh: 玉米价格
    tier: margin
    freq: daily
    unit: CNY/tonne
    lo: 500.0
    hi: 5000.0
    adapter: akshare
    call: {fn: futures_hog_cost, symbol: 玉米}
    notes: >
      源站按 元/吨 报价（约 2374），不是元/公斤 —— 早先配置误写为 CNY/kg 且
      范围 [0.5, 10.0]，导致每次采集整批被离群值绊线拒绝。
      silver 忠于源单位，量纲统一留给 gold：那里本来就要为利润和猪粮比对齐
      单位，集中在一处比在摄取时偷偷换算更可追溯。
      仅约 1 年滚动窗口。

  - id: hog_corn_ratio
    name_zh: 猪粮比价
    tier: margin
    freq: weekly
    unit: ratio
    lo: 1.0
    hi: 25.0
    adapter: akshare
    call: {fn: futures_hog_supply, symbol: 猪粮比价}
    notes: >
      官方调控触发线 5:1（过度下跌一级预警）。历史深度约 6 年，是一期里
      养殖利润的代理指标 —— 真实测算要等农业农村部 500 县同口径成本数据接入。

  # ---------- price：被预测的结果 ----------

  - id: hog_price_index
    name_zh: 生猪成交均价
    tier: price
    freq: weekly
    unit: CNY/kg
    lo: 3.0
    hi: 60.0
    adapter: akshare
    call: {fn: index_hog_spot_price}
    extract: {period: 日期, value: 成交均价}
    notes: >
      行情宝平台成交口径，2015 年起约 11.7 年周频 —— 是本项目历史深度最长的
      猪价序列，周期定位的骨架。
      与玄田「全国均价」、农业农村部「500 县集贸市场」是三套不同口径，
      永远不要画进同一条曲线。

  - id: hog_price_wai3
    name_zh: 外三元生猪出栏均价
    tier: price
    freq: daily
    unit: CNY/kg
    lo: 3.0
    hi: 60.0
    adapter: akshare
    call: {fn: futures_hog_core, symbol: 外三元}
    notes: >
      玄田数据/中国养猪网口径。全国均价，不是加权。
      仅约 1 年滚动窗口 —— 超过一年的数据会从源头消失，所以日常采集不只是
      为了记录修订，更是为了在 akshare 删掉之前把它留下来。

  - id: carcass_price
    name_zh: 白条肉平均出厂价格
    tier: price
    freq: weekly
    unit: CNY/kg
    lo: 5.0
    hi: 60.0
    adapter: akshare
    call: {fn: futures_hog_supply, symbol: 白条肉}
    extract: {period: 周期, value: 白条肉平均出厂价格}
    notes: >
      屠宰端出厂价，约 8.5 年周频。期间标签形如「2018年第01周」，由周解析器
      映射到该 ISO 周的周日；第N周与 ISO 周在年末年初可能差几天，对周频序列
      而言在测量自身分辨率之内。

  - id: meat_price_index
    name_zh: 肉类价格指数（已封存）
    tier: price
    freq: monthly
    unit: index
    lo: 50.0
    hi: 400.0
    adapter: akshare
    call: {fn: futures_hog_supply, symbol: 肉类价格指数}
    # 玄田这张表和「生猪产能」同时死在 2025年10月：上游最后一行就是
    # 2025-10-01，不是我们采不到。陈旧度守卫上线第一次运行就报了它 340 天。
    # 标为封存是为了不让 CI 天天飘红 —— 但这是「我们够得着的源不再发布」，
    # 不是「口径正式关闭」，所以它保留在叠放里，随时可以复活。
    # 替代品见 pork_retail_price：农业农村部联合发布的月频零售价，是原始来源
    # 而不是镜像。
    retired: true
    notes: >
      2017-01 至 2025-10 的跨肉类相对价格背景，用于判断猪肉是独立行情还是普涨。
      玄田镜像 2025年10月停更，无替代口径的指数源；若上游恢复，去掉 retired
      即可继续采。

  - id: pork_retail_price
    name_zh: 猪肉零售价（36城精瘦肉）
    tier: price
    freq: monthly
    unit: CNY/kg
    lo: 5.0
    hi: 200.0
    adapter: moa
    call: {fn: moa_hog_release}
    extract: {value: 36个大中城市猪肉（精瘦肉）零售价格}
    notes: >
      消费端价格，发改委在 36 个大中城市有代表性的超市和农贸市场采集。
      这是第四套口径，与玄田全国均价、行情宝平台成交、农业农村部集贸市场
      都不同 —— 它在零售端，天然高于出场价，不可与任何一条并成一条曲线。

  # ---------- noise：短期扰动 ----------

  - id: hog_weight
    name_zh: 出栏均重
    tier: noise
    freq: weekly
    unit: kg
    lo: 50.0
    hi: 200.0
    adapter: akshare
    call: {fn: index_hog_spot_price}
    extract: {period: 日期, value: 成交均重}
    zero_is_null: true
    notes: >
      与 hog_price_index 同一个 upstream call，管道层按 call identity 缓存，
      一次运行只取一次。
      上行=惜售压栏（推迟供给），下行=恐慌出栏（提前供给）—— 判断短期拐点的
      关键，但不改变周期本身。
      2015 年 10 月之前该列以 0 表示「未采集」而非空值，故 zero_is_null。

  # ---------- equity：对周期的索取权，不是周期本身 ----------
  #
  # 股价不是因果链上的一环，是对这条链的定价，所以默认不进因果链图表墙
  # （in_wall=false），归宿是叠放图 —— 那里才回答它真正有信息量的问题：
  # 相对能繁母猪，市场是领先还是滞后。
  #
  # 用新浪而非东方财富：push2his.eastmoney.com 对密集请求会限流到「空响应」，
  # 且恢复缓慢。新浪是不同主机，故障模式独立。
  #
  # 存日频全保真（silver 是记录层），展示层降采样成周频 —— 见 gold/wall.py。
  #
  # 后复权（hfq）：不复权会在分红除权处出现假跳空，长周期比较必须复权。
  # 但各数据商的复权基准不同（同一天牧原：新浪 882.87 / 东财 845.81），
  # 所以复权序列绝不可跨源混用，换源等于换一条序列。
  # lo/hi 放得极宽 —— 后复权价格会随时间无界增长（牧原 2015 年 44 → 2026 年 846），
  # 绊线只用于抓解析崩坏，不是价格预期。

  - id: eq_muyuan
    name_zh: 牧原股份
    tier: equity
    freq: daily
    unit: CNY
    lo: 1.0
    hi: 100000.0
    adapter: akshare
    call: {fn: stock_zh_a_daily, symbol: "sz002714",
           start_date: "20150101", end_date: "20991231", adjust: hfq}
    extract: {value: close}
    notes: 行业绝对龙头，自繁自养一体化，与猪价和产能的关系最直接。

  - id: eq_wens
    name_zh: 温氏股份
    tier: equity
    freq: daily
    unit: CNY
    lo: 1.0
    hi: 100000.0
    adapter: akshare
    call: {fn: stock_zh_a_daily, symbol: "sz300498",
           start_date: "20150101", end_date: "20991231", adjust: hfq}
    extract: {value: close}
    notes: 公司+农户模式，与自繁自养对同一周期的反应差异本身就有信息。

  - id: eq_newhope
    name_zh: 新希望
    tier: equity
    freq: daily
    unit: CNY
    lo: 1.0
    hi: 100000.0
    adapter: akshare
    call: {fn: stock_zh_a_daily, symbol: "sz000876",
           start_date: "20150101", end_date: "20991231", adjust: hfq}
    extract: {value: close}
    notes: 饲料+养殖多元化，猪周期敞口被其他业务稀释，弹性小于纯养殖标的。

  - id: eq_shennong
    name_zh: 神农集团
    tier: equity
    freq: daily
    unit: CNY
    lo: 1.0
    hi: 100000.0
    adapter: akshare
    call: {fn: stock_zh_a_daily, symbol: "sh605296",
           start_date: "20150101", end_date: "20991231", adjust: hfq}
    extract: {value: close}
    notes: 2020 年底上市，序列短于其余各家，起点晚不是采集缺失。

  - id: eq_juxing
    name_zh: 巨星农牧
    tier: equity
    freq: daily
    unit: CNY
    lo: 1.0
    hi: 100000.0
    adapter: akshare
    call: {fn: stock_zh_a_daily, symbol: "sh603477",
           start_date: "20150101", end_date: "20991231", adjust: hfq}
    extract: {value: close}
    notes: 中小市值弹性标的，周期底部弹性通常大于龙头。原为皮革业务，后转型养殖。

  - id: eq_huatong
    name_zh: 华统股份
    tier: equity
    freq: daily
    unit: CNY
    lo: 1.0
    hi: 100000.0
    adapter: akshare
    call: {fn: stock_zh_a_daily, symbol: "sz002840",
           start_date: "20150101", end_date: "20991231", adjust: hfq}
    extract: {value: close}
    notes: 屠宰+养殖一体，屠宰端使其对猪价的敞口方向与纯养殖标的不完全一致。
