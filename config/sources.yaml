# Adding an indicator should be a config change, not a code change.
#
# tier follows the causal chain:
#   capacity  能繁母猪 → (10-12m) → 商品猪出栏   真正的先行指标
#   margin    盈亏，决定去化会不会持续
#   price     被预测的结果本身，不是驱动因素
#   noise     短期供需扰动，影响股价不影响周期
#
# lo/hi are tripwires for unit drift and upstream parser breaks, not
# forecasts. Set them roughly 3x wider than any plausible move.
#
# extract 只在源不是 akshare 惯例的 date/value 窄表时才需要写。默认值就是
# date/value —— 那是一个明确约定，不是模糊猜测。之前那份靠全局候选列名猜列的
# 实现，正是 sow_inventory 静默采不进来的根因。
#
# upstream_dark 是介于「活着」和 retired 之间的第三种状态：口径还在，但我们
# 够得着的源停更了，一手来源的 adapter 还没建。陈旧度守卫照样每次报它、网站
# 照样标它过期，只是到 review_by 之前不再让运行变红 —— 过了这天自动重新变红。
# 一次最多 92 天，续期要改 review_by 提交一次，是个有人负责的决定。
# 别拿它代替 retired（口径关闭）或调松 max_age_days（节奏本来就慢）。
#
# freq 是「裸日期标签」的兜底粒度。带中文期间标签的行（2009 / 2025年7月 /
# 2025年一季度（末） / 2018年第01周）由标签自己决定粒度，逐行记录。

indicators:

  # ---------- capacity：真正的先行指标 ----------

  - id: sow_inventory
    name_zh: 能繁母猪存栏
    name_en: Breeding sow inventory
    tier: capacity
    freq: monthly
    unit: 万头
    lo: 1000.0
    hi: 10000.0
    adapter: moa
    reach: cn
    call: {fn: moa_hog_release}
    extract: {value: 能繁母猪存栏}
    revises: true
    # 公开口径 2025 年底由月频转季频：季度末印出后要等下一个季度才有新值，
    # 最新 obs_date 会合法地老化到 110 天以上。按 monthly 的 100 天默认阈值
    # 会在每年 10 月中旬误报，所以这里显式放宽 —— 而不是把默认值调松。
    max_age_days: 150
    notes: >
      唯一真正的先行指标。revises 表示盯着它会不会被回溯修订 —— 但截至
      2026-10，手上 55 期一手月报里没有一期改过前期数（ADR-0017）。它真正
      要求 bitemporal 的是发布滞后：月度数据在期末后 20–59 天才公开（中位
      28 天），回测必须按 published_on 截断，而不是按 obs_date。
      2026-09 从 akshare 换源到农业农村部。原路径的上游是玄田数据这个第三方
      镜像，2025年10月起停更却继续供应旧数据，采集器每天照报 ok，序列静默
      冻结了 11 个月。详见 docs/adr/0013。
      现源为农业农村部、发改委、商务部、海关总署、国家统计局联合发布的
      《生猪产品数据》，每月一期 XLSX。粒度逐行记录，不可拉成一条平滑曲线
      冒充等价测量：
        2009-2020 年度值 —— 仍是玄田快照，保存在 bronze，不再有活源
        2021-12 至 2025-10 月频 —— 非季度末月份由农业农村部定点监测的环比
                                   变化率，以统计局季度末数为基数推算
        2026 起 季频 —— 公开口径改为只发季度末的统计局数
      对本序列，granularity 恰好编码了口径。
      正常保有量基准值本身也会调整（4100 → 3900 → 3750，末次调整见
      《生猪产能综合调控实施方案（2026年修订）》），做同比或缺口计算时必须用
      当期基准，不能用今天的。每期发布都写明「相当于正常保有量的 X%」，所以
      当期基准是可以从原文反推的 —— 但那是 gold 层的事，silver 只存原值。

  - id: hog_inventory
    name_zh: 生猪存栏
    name_en: Hog inventory
    tier: capacity
    freq: quarterly
    unit: 万头
    lo: 10000.0
    hi: 100000.0
    adapter: moa
    reach: cn
    call: {fn: moa_hog_release}
    extract: {value: 生猪存栏}
    revises: true
    max_age_days: 150
    notes: >
      总栏舍占用，不是先行指标 —— 它把 10-12 个月前的母猪决策和眼前的压栏
      行为混在一起。放在 capacity 层是因为它和能繁母猪同源同表、同为统计局
      季度调查监测数，读的时候要清楚：领先性来自母猪那条线，不是这条。

  - id: slaughter
    name_zh: 定点屠宰量（全口径）
    name_en: Slaughter volume (all designated plants)
    tier: capacity
    freq: monthly
    unit: 万头
    lo: 100.0
    hi: 20000.0
    adapter: moa
    reach: cn
    call: {fn: moa_hog_release}
    extract: {value: 生猪定点屠宰企业屠宰量}
    # 新口径自 2025年7月起；此前的规模以上口径是另一个指标（ADR-0026）。
    caliber_from: 2025-07-01
    continues: slaughter_above_scale
    notes: >
      月频出栏的近似 —— 产能兑现为供给的那一步，也是这套数据里唯一月频的
      供给侧实测量。2025年7月起的新口径，覆盖全国生猪定点屠宰企业。
      与 slaughter_above_scale 是两个指标而不是一条线：2025年7月覆盖面
      扩大，绝对值随之跳升，接在一起会凭空造出一次「供给暴增」。官方自己的
      同比环比也按可比口径另算。

  - id: slaughter_above_scale
    name_zh: 定点屠宰量（规模以上）
    name_en: Slaughter volume (plants above designated size)
    tier: capacity
    freq: monthly
    unit: 万头
    lo: 100.0
    hi: 20000.0
    adapter: moa
    reach: cn
    call: {fn: moa_hog_release}
    extract: {value: 规模以上生猪定点屠宰企业屠宰量}
    # 2025年7月起上游不再发布这个口径。序列到此为止 —— 它是完成了，不是冻住
    # 了，所以「采不到」是预期而非故障：不报错、不算陈旧、不上图表墙。
    retired: true
    notes: >
      2025年6月及以前的旧口径，只覆盖规模以上企业，因此系统性低于全口径。
      保留它是因为它提供 2021-12 至 2025-06 的月频供给史；不可与 slaughter
      接成一条曲线。

  - id: hog_output_ytd
    name_zh: 生猪出栏（年内累计）
    name_en: Hogs marketed (year to date)
    tier: capacity
    freq: quarterly
    unit: 万头
    lo: 5000.0
    hi: 150000.0
    adapter: moa
    reach: cn
    call: {fn: moa_hog_release}
    extract: {value: 生猪出栏}
    # 统计局只按年内累计印：1季度、上半年、前3季度、全年（ADR-0030）。
    ytd: true
    notes: >
      国家统计局的生猪出栏，经五部委联合发布，只在季末那期出现。每个数都是从 1 月 1 日
      累计到所注期末的总数，所以按时间画出来是每年 1 月归零的锯齿，不上图表墙；
      单季出栏由 gold 用相邻两个累计数相减得到（hog_output_quarter）。
      202506 那期没有附表，所以 2025 年上半年的累计数不在手上，2025 年二、三季度的
      单季数也就算不出来 —— 不用别的数去补。「1-n月累计」屠宰量是另一个口径，不读。
      历史从已采集的各期月报回放而来（ADR-0027），没有重新抓取。

  - id: pork_output_ytd
    name_zh: 猪肉产量（年内累计）
    name_en: Pork output (year to date)
    tier: capacity
    freq: quarterly
    unit: 万吨
    lo: 300.0
    hi: 10000.0
    adapter: moa
    reach: cn
    call: {fn: moa_hog_release}
    extract: {value: 猪肉产量}
    ytd: true
    notes: >
      国家统计局的猪肉产量，与生猪出栏同表、同一期、同样只按年内累计印。单季产量在
      gold 里由相邻两个累计数相减（pork_output_quarter）。产量 ÷ 出栏随出栏体重变化，
      所以两条不是同一条线换个单位。

  - id: piglet_price
    name_zh: 仔猪价格
    name_en: Piglet price
    tier: capacity
    freq: weekly
    unit: CNY/kg
    lo: 5.0
    hi: 200.0
    adapter: moa_weekly
    reach: cn
    call: {report: market}
    extract: {value: 全国仔猪平均价格}
    notes: >
      补栏意愿的价格表达，是产能层里最灵敏的一个。母猪存栏是补栏行为的结果，
      仔猪价是补栏意愿的即时报价。
      农业农村部 500 个县集贸市场和采集点周度监测（畜牧兽医局「畜产品和饲料
      集贸市场价格情况」），每周一个采集日，节假日前后采集日会挪动。
      2026-10 由 akshare（玄田镜像）换回一手来源：玄田这张表 2026-08-20 停更后
      照常返回旧数据（ADR-0013 同一种故障）。换源前逐周核对：重叠的 238 周里
      236 周逐位相同；2023-10-25 一手是 25.63、玄田是 25.36（镜像抄错两位数字），
      另一周玄田日期偏两天。换源后 silver 把 25.63 记为对 25.36 的更正。
      源站按公斤报价，行业新闻常按元/头报 7kg 断奶仔猪，换算前先确认体重口径。

  - id: piglet_price_monthly
    name_zh: 仔猪价格（月均）
    name_en: Piglet price (monthly mean)
    tier: capacity
    freq: monthly
    unit: CNY/kg
    lo: 5.0
    hi: 200.0
    adapter: moa
    reach: cn
    call: {fn: moa_hog_release}
    extract: {value: 全国仔猪价格}
    notes: >
      农业农村部全国 500 个县域中心集贸市场固定监测的仔猪价格，随五部委联合发布
      每月一期。与 piglet_price 是同一套调查：2021-12 至 2026-07 的 55 个月里，
      43 个月与玄田周度值的当月均值精确到分相同，53 个月相差在 1% 以内。
      但它是月均而不是周值 —— 粒度不同就是两个指标，不接成一条线。
      2026-10 加入，作为玄田周度表停更期间的一手替代；500 县周报 adapter 建成后
      周度回到一手来源，本序列作为月度口径继续保留。

  - id: sow_binary_price
    name_zh: 二元母猪价格
    name_en: Crossbred gilt price
    tier: capacity
    freq: monthly
    unit: CNY/kg
    lo: 5.0
    hi: 200.0
    adapter: moa
    reach: cn
    call: {fn: moa_hog_release}
    extract: {value: 全国二元母猪销售价格}
    notes: >
      后备产能的价格表达。发改委价格监测中心数据，覆盖全国生猪主产区的定点
      采报单位。
      2026-09 由 akshare（玄田镜像）换到农业农村部联合发布。两边同期数值逐位
      相同 —— 玄田一直转的就是这套发改委数，但它落后一个月，而陈旧度守卫上线
      当天就把这条也点了出来。原 freq 标为 weekly 是错的：源头给的是月末日期，
      月频。历史行仍保留在 silver，粒度按当时解析结果记为 weekly。


  # ---------- 境外来源：USDA 对中国的估计与预测 ----------

  - id: usda_sow_stocks
    name_zh: 能繁母猪期初存栏（USDA 估计）
    name_en: Sow beginning stocks (USDA estimate)
    tier: capacity
    freq: annual
    unit: 1000 head
    lo: 10000.0
    hi: 100000.0
    adapter: usda_psd
    call: {commodity: "Animal Numbers, Swine", unit: "(1000 HEAD)", at: start}
    extract: {value: Sow Beginning Stocks}
    zero_is_null: true
    forecast: true
    notes: >
      USDA FAS PSD 对中国能繁母猪期初存栏的估计，最新一年是预测。按 1 月 1 日
      即上年 12 月 31 日记，和统计局年末数同一时点：2023 年末起与统计局一致，
      2021、2022 年是 USDA 自己的估计（42,000 / 43,000 千头，统计局为
      4,329 / 4,390 万头）。单位保持 USDA 的千头，不换算成万头。
      每年 4 月、10 月的畜产品报告会修订，每天采集就能把修订记成新行 ——
      这是本项目里唯一一个会定期修订自己的来源。

  - id: usda_pork_production
    name_zh: 猪肉产量（USDA 估计）
    name_en: Pork production (USDA estimate)
    tier: capacity
    freq: annual
    unit: 1000 t CWE
    lo: 1000.0
    hi: 100000.0
    adapter: usda_psd
    call: {commodity: "Meat, Swine", unit: "(1000 MT CWE)", at: end}
    extract: {value: Production}
    zero_is_null: true
    forecast: true
    notes: >
      USDA 对中国猪肉年产量的估计与预测，千吨胴体当量。是能繁母猪变化最终
      落到供给上的那一端，且有下一年的预测。

  # ---------- margin：决定去化会不会持续 ----------

  - id: corn_price
    name_zh: 玉米价格
    name_en: Corn price
    tier: margin
    freq: daily
    unit: CNY/tonne
    lo: 500.0
    hi: 5000.0
    adapter: akshare
    reach: cn
    call: {fn: futures_hog_cost, symbol: 玉米}
    notes: >
      源站按 元/吨 报价（约 2374），不是元/公斤 —— 早先配置误写为 CNY/kg 且
      范围 [0.5, 10.0]，导致每次采集整批被离群值绊线拒绝。
      silver 忠于源单位，量纲统一留给 gold：那里本来就要为利润和猪粮比对齐
      单位，集中在一处比在摄取时偷偷换算更可追溯。
      仅约 1 年滚动窗口。

  - id: hog_corn_ratio
    name_zh: 猪粮比价
    name_en: Hog-to-corn price ratio
    tier: margin
    freq: weekly
    unit: ratio
    lo: 1.0
    hi: 25.0
    adapter: akshare
    reach: cn
    call: {fn: futures_hog_supply, symbol: 猪粮比价}
    upstream_dark:
      acknowledged: 2026-10-11
      review_by: 2026-12-31
      reason: >
        玄田这张周度表最后一行是 2026-08-19，之后照常返回旧数据，同站日频表照常
        更新。一手来源是发改委价格监测中心的周报，但它在中国价格信息网上只以
        图片发布，最新公开一期是 2026-06-24 的数据（2026-06-29 发布），没有
        可机读的一手源。总览页的利润读数已改用 hog_corn_ratio_county（农业农村部
        500 县同一采集日的生猪价 ÷ 玉米价，gold 计算，口径不同、名字也不同）。
        到 review_by 若仍无可机读来源，按封存处理。
    notes: >
      官方调控触发线 5:1（过度下跌一级预警）。历史深度约 6 年，是一期里
      养殖利润的代理指标 —— 真实测算要等农业农村部 500 县同口径成本数据接入。

  - id: corn_price_county
    name_zh: 玉米价格（500县集贸）
    name_en: Corn price (500-county markets)
    tier: margin
    freq: weekly
    unit: CNY/kg
    lo: 0.5
    hi: 10.0
    adapter: moa_weekly
    reach: cn
    call: {report: market}
    extract: {value: 全国玉米平均价格}
    notes: >
      农业农村部 500 县集贸市场周度监测里的玉米价，元/公斤。和 corn_price
      （玄田日频、元/吨、只有约一年窗口）是两个口径。它的用处是和同一份周报、
      同一个采集日的生猪价相除：hog_corn_ratio_county 在 gold 里由这两条算出，
      分子分母来自同一次调查，不需要跨源对齐日期。

  - id: feed_price_county
    name_zh: 育肥猪配合饲料价格（500县集贸）
    name_en: Finishing-hog compound feed price (500-county markets)
    tier: margin
    freq: weekly
    unit: CNY/kg
    lo: 1.0
    hi: 10.0
    adapter: moa_weekly
    reach: cn
    call: {report: market}
    extract: {value: 育肥猪配合饲料平均价格}
    notes: >
      养殖成本里最大的一项。同一份 500 县周报，同一采集日。

  - id: soymeal_price_county
    name_zh: 豆粕价格（500县集贸）
    name_en: Soybean meal price (500-county markets)
    tier: margin
    freq: weekly
    unit: CNY/kg
    lo: 1.0
    hi: 10.0
    adapter: moa_weekly
    reach: cn
    call: {report: market}
    extract:
      value: 全国豆粕平均价格
      # 5月份第4周 2023 (published 2023-05-30) printed 「全国豆粕价格4.50元/公斤」:
      # the same figure in the same report, 平均 dropped once in 250 articles
      # (docs/adr/0027).
      also: [全国豆粕价格]
    notes: >
      饲料里的蛋白原料，和玉米一起决定配合饲料的成本。同一份 500 县周报、同一采集日，
      所以和 corn_price_county、feed_price_county 可以逐周对齐。历史从已采集的同一份
      周报里回放而来（ADR-0027），没有重新抓取。

  - id: scale_profit_per_head
    name_zh: 每头净利润（规模养殖）
    name_en: Net profit per hog (scale farms)
    tier: margin
    freq: monthly
    unit: CNY/head
    lo: -2000.0
    hi: 5000.0
    adapter: moa
    reach: cn
    call: {fn: moa_hog_release}
    extract: {value: 规模养殖生猪每头净利润}
    # 202508 那期之后的联合发布不再有这一行（ADR-0027）。背后的调查是否在别处继续，
    # 这里无从得知；发布它的那张表关闭了它，所以从一开始就是 retired。
    retired: true
    notes: >
      五部委月度联合发布里的规模养殖每头净利润，2021-12 至 2025-08。负值是亏损。
      历史从已采集的各期月报回放而来。

  - id: scale_cost_per_head
    name_zh: 每头成本（规模养殖）
    name_en: Cost per hog (scale farms)
    tier: margin
    freq: monthly
    unit: CNY/head
    lo: 500.0
    hi: 5000.0
    adapter: moa
    reach: cn
    call: {fn: moa_hog_release}
    extract: {value: 规模养殖生猪每头成本}
    # Same as scale_profit_per_head: last printed in the 202508 edition.
    retired: true
    notes: >
      五部委月度联合发布里的规模养殖每头总成本，2021-12 至 2025-08。与每头净利润
      出自同一张表、同一个月。

  - id: backyard_profit_per_head
    name_zh: 每头净利润（散养）
    name_en: Net profit per hog (backyard farms)
    tier: margin
    freq: monthly
    unit: CNY/head
    lo: -2000.0
    hi: 5000.0
    adapter: moa
    reach: cn
    call: {fn: moa_hog_release}
    extract: {value: 散养生猪每头净利润}
    # Printed beside the scale-farm rows and closed with them after 202508.
    retired: true
    notes: >
      同一张表里散养户的每头净利润，2021-12 至 2025-08，与规模养殖的那一行并列。
      散养户成本高、进退快，两条的差就是规模化的成本优势。负值是亏损。

  # ---------- price：被预测的结果 ----------

  - id: hog_price_index
    name_zh: 生猪成交均价
    name_en: Average hog transaction price
    tier: price
    freq: weekly
    unit: CNY/kg
    lo: 3.0
    hi: 60.0
    adapter: akshare
    call: {fn: index_hog_spot_price}
    extract: {period: 日期, value: 成交均价}
    notes: >
      行情宝平台成交口径，2015 年起约 11.7 年周频 —— 是本项目历史深度最长的
      猪价序列，周期定位的骨架。
      与玄田「全国均价」、农业农村部「500 县集贸市场」是三套不同口径，
      永远不要画进同一条曲线。

  - id: hog_price_wai3
    name_zh: 外三元生猪出栏均价
    name_en: Three-way crossbred hog ex-farm price
    tier: price
    freq: daily
    unit: CNY/kg
    lo: 3.0
    hi: 60.0
    adapter: akshare
    reach: cn
    call: {fn: futures_hog_core, symbol: 外三元}
    notes: >
      玄田数据/中国养猪网口径。全国均价，不是加权。
      仅约 1 年滚动窗口 —— 超过一年的数据会从源头消失，所以日常采集不只是
      为了记录修订，更是为了在 akshare 删掉之前把它留下来。

  - id: hog_price_county
    name_zh: 生猪价格（500县集贸）
    name_en: Hog price (500-county markets)
    tier: price
    freq: weekly
    unit: CNY/kg
    lo: 3.0
    hi: 60.0
    adapter: moa_weekly
    reach: cn
    call: {report: market}
    extract: {value: 全国生猪平均价格}
    notes: >
      ADR-0005 的第二口径：农业农村部 500 个县集贸市场和采集点。与行情宝平台
      成交价（hog_price_index）、玄田外三元出栏价（hog_price_wai3）是三套
      不同的测量，各自一格，永远不画进同一条线。2021-12 起有周度历史。

  - id: hog_price_ndrc
    name_zh: 生猪出场价格（发改委）
    name_en: Hog ex-farm price (NDRC)
    tier: price
    freq: monthly
    unit: CNY/kg
    lo: 3.0
    hi: 60.0
    adapter: moa
    reach: cn
    call: {fn: moa_hog_release}
    extract: {value: 全国生猪出场价格}
    notes: >
      发改委价格监测中心在全国生猪主产区定点采报的出场价，月度，随五部委联合发布。
      这是第五套猪价口径：发改委自己的猪粮比价就是它除以全国玉米批发价，所以 5:1
      那条线定义在这个价格上。它不是 hog_price_index、hog_price_wai3 或 500 县的
      任何一条，各自一格。历史从已采集的各期月报回放而来（ADR-0027）。

  - id: carcass_price
    name_zh: 白条肉出厂价（定点屠宰企业）
    name_en: Carcass ex-plant price (designated plants)
    tier: price
    freq: weekly
    unit: CNY/kg
    lo: 5.0
    hi: 60.0
    adapter: moa_weekly
    reach: cn
    call: {report: slaughter, scope: 全部定点}
    extract: {value: 白条肉平均出厂价格}
    caliber_from: 2024-01-01
    continues: carcass_price_above_scale
    notes: >
      屠宰端出厂价，农业农村部畜牧兽医局「生猪定点屠宰企业生猪收购和白条肉
      出厂价格情况」，周一至周日一周一期。
      口径在 2024-01-01 这一周变了：此前调查对象是「全国规模以上生猪定点屠宰
      企业」，此后是全部定点屠宰企业。水平几乎没动（20.62 → 20.36，一周的
      正常波动），但调查对象变了就是两个口径 —— 此前的历史在
      carcass_price_above_scale。玄田镜像把两段当一张表供，2026-10 换回一手
      来源时才看到这条缝。重叠的 142 周与玄田逐位相同。

  - id: carcass_price_above_scale
    name_zh: 白条肉出厂价（规模以上定点屠宰企业）
    name_en: Carcass ex-plant price (plants above designated size)
    tier: price
    freq: weekly
    unit: CNY/kg
    lo: 5.0
    hi: 60.0
    adapter: akshare
    reach: cn
    call: {fn: futures_hog_supply, symbol: 白条肉}
    extract: {period: 周期, value: 白条肉平均出厂价格}
    caliber_until: 2023-12-31
    # 口径已在 2024-01 由上游关闭，不是我们采不到。
    retired: true
    notes: >
      2018 至 2023 年的规模以上口径，来自玄田镜像（与农业农村部原文重叠的
      周逐位相同）。期间标签形如「2018年第01周」，映射到该 ISO 周的周日，
      与一手周报的周日对得上。保留在对比页，不上图表墙。

  - id: meat_price_index
    name_zh: 肉类价格指数（已封存）
    name_en: Meat price index (retired)
    tier: price
    freq: monthly
    unit: index
    lo: 50.0
    hi: 400.0
    adapter: akshare
    reach: cn
    call: {fn: futures_hog_supply, symbol: 肉类价格指数}
    # 玄田这张表和「生猪产能」同时死在 2025年10月：上游最后一行就是
    # 2025-10-01，不是我们采不到。陈旧度守卫上线第一次运行就报了它 340 天。
    # 标为封存是为了不让 CI 天天飘红 —— 但这是「我们够得着的源不再发布」，
    # 不是「口径正式关闭」，所以它保留在叠放里，随时可以复活。
    # 替代品见 pork_retail_price：农业农村部联合发布的月频零售价，是原始来源
    # 而不是镜像。
    retired: true
    notes: >
      2017-01 至 2025-10 的跨肉类相对价格背景，用于判断猪肉是独立行情还是普涨。
      玄田镜像 2025年10月停更，无替代口径的指数源；若上游恢复，去掉 retired
      即可继续采。

  - id: pork_price_county
    name_zh: 猪肉价格（500县集贸）
