      都不同 —— 它在零售端，天然高于出场价，不可与任何一条并成一条曲线。

  # ---------- noise：短期扰动 ----------

  - id: pork_imports
    name_zh: 猪肉进口量（海关）
    name_en: Pork imports (customs)
    tier: noise
    freq: monthly
    unit: 万吨
    lo: 0.5
    hi: 100.0
    adapter: moa
    reach: cn
    call: {fn: moa_hog_release}
    extract: {value: 进口猪肉}
    notes: >
      海关总署的月度进口量，经五部委联合发布。只取单月行；「1-n月累计」行不读。
      海关把 1、2 月合并公布：2 月那期同时印出 2 月单月数和 1-2 月合计，1 月单月数
      哪里都没有。不用合计减 2 月去算 1 月 —— 没人印过的数不画进印出来的数里
      （ADR-0027），图上每年 12 月到 2 月之间是虚线。按月度默认的 100 天判断是否
      停更：12 月的数要到 3 月下旬那期之后才有下一个，约 90 天，仍在阈值内。
      历史从已采集的各期月报回放而来，没有重新抓取。

  - id: offal_imports
    name_zh: 猪杂碎进口量（海关）
    name_en: Pork offal imports (customs)
    tier: noise
    freq: monthly
    unit: 万吨
    lo: 0.5
    hi: 100.0
    adapter: moa
    reach: cn
    call: {fn: moa_hog_release}
    extract: {value: 进口猪杂碎}
    notes: >
      海关总署的月度猪杂碎（内脏、蹄、头等副产品）进口量，与进口猪肉同表。量级和
      猪肉进口相当，但主要进餐饮和加工，对生猪价格的缓冲比猪肉进口弱。与 pork_imports
      一样只读单月行，1 月并在 1-2 月合计里、没有单独的数。

  - id: hog_weight
    name_zh: 出栏均重
    name_en: Average market weight
    tier: noise
    freq: weekly
    unit: kg
    lo: 50.0
    hi: 200.0
    adapter: akshare
    call: {fn: index_hog_spot_price}
    extract: {period: 日期, value: 成交均重}
    zero_is_null: true
    notes: >
      与 hog_price_index 同一个 upstream call，管道层按 call identity 缓存，
      一次运行只取一次。
      上行=惜售压栏（推迟供给），下行=恐慌出栏（提前供给）—— 判断短期拐点的
      关键，但不改变周期本身。
      2015 年 10 月之前该列以 0 表示「未采集」而非空值，故 zero_is_null。

  # ---------- equity：对周期的索取权，不是周期本身 ----------
  #
  # 股价不是因果链上的一环，是对这条链的定价，所以默认不进因果链图表墙
  # （in_wall=false），归宿是叠放图 —— 那里才回答它真正有信息量的问题：
  # 相对能繁母猪，市场是领先还是滞后。
  #
  # 用新浪而非东方财富：push2his.eastmoney.com 对密集请求会限流到「空响应」，
  # 且恢复缓慢。新浪是不同主机，故障模式独立。
  #
  # 存日频全保真（silver 是记录层），展示层降采样成周频 —— 见 gold/wall.py。
  #
  # 后复权（hfq）：不复权会在分红除权处出现假跳空，长周期比较必须复权。
  # 但各数据商的复权基准不同（同一天牧原：新浪 882.87 / 东财 845.81），
  # 所以复权序列绝不可跨源混用，换源等于换一条序列。
  # lo/hi 放得极宽 —— 后复权价格会随时间无界增长（牧原 2015 年 44 → 2026 年 846），
  # 绊线只用于抓解析崩坏，不是价格预期。

  - id: eq_muyuan
