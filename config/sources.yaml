    extract:
      value: 全国猪肉平均价格
      # 2月份第3周 2023 (published 2023-02-21) printed 「全国猪肉平均26.70元/公斤」:
      # the same figure, 价格 dropped once in 250 articles (docs/adr/0027).
      also: [全国猪肉平均]
    notes: >
      500 县集贸市场的猪肉均价，和生猪价格出自同一份周报、同一采集日，所以两者的差是
      同一批市场里从毛猪到白肉的价差。与 36 城精瘦肉零售价（pork_retail_price，
      月度、城市、零售）是两个口径，各自一格。历史从已采集的周报回放而来（ADR-0027）。

  - id: pork_retail_price
    name_zh: 猪肉零售价（36城精瘦肉）
