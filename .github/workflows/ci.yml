name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e "./backend[dev]"
      - run: cd backend && ruff check .
      # Fixtures are real captured payloads, so these run without network.
      - run: cd backend && pytest -q
      # Export the committed silver and validate it against the schema, so a
      # change that breaks the contract fails the push that made it (ADR-0024).
      - run: hogcycle export --out "$RUNNER_TEMP/wall.json"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "24", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: cd frontend && npm ci
      # The browser-side computations (window facts, the as-of cut), under
      # node's own runner: no test framework to install.
      - run: cd frontend && npm test
      # Regenerates types from contracts/ first, so a schema change that the
      # frontend has not absorbed fails here rather than in a live chart.
      - run: cd frontend && npm run build
