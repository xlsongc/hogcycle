name: collect

on:
  schedule:
    - cron: "0 1 * * *"   # 09:00 Asia/Shanghai — after the morning quotes settle
  workflow_dispatch:

# Daily commits of data are the audit trail. Never force-push this branch:
# rewriting it destroys exactly the history the project exists to keep.
permissions:
  contents: write
  # The stale-series issue. A red run alone stayed red for 26 days unread.
  issues: write

# A manual dispatch overlapping the cron run would race on push. Queue instead
# of cancelling — a skipped run silently loses a day of daily series, which
# upstream only retains for about a year (docs/adr/0004).
concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e "./backend[dev]"
      - run: cd backend && pytest -q
      # Exits non-zero only when a whole source is unreachable, never for a
      # single flaky series. The steps below run either way: a bad source is
      # a reason to go red, not a reason to throw away what did collect.
      #
      # Only sources that answer a datacenter address. 农业农村部 returns 403
      # to this runner and 玄田 never answers it; those (`reach: cn`) are
      # collected by scripts/local-collector on an ordinary connection. The
      # staleness check below still covers every series, so this run is the
      # watchdog for that one too (ADR-0022).
      - run: hogcycle collect --reach anywhere
      - name: Commit changed series
        if: always()
        run: |
          git config user.name  "hogcycle-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && echo "no change today" && exit 0
          git commit -m "data: $(date -u +%Y-%m-%d)"
          # Another run may have landed while this one collected.
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push

      # Deliberately after the commit: a stale series is an alarm about the
      # source, not a reason to throw away the data this run did collect.
      # Failing here turns the eleven-month silent freeze that motivated
      # docs/adr/0013 into a red run on the first day it would recur.
      - name: Check for series that have stopped advancing
        id: stale
        if: always()
        run: |
          hogcycle status | tee status.txt
          hogcycle status --json > status.jsonl

      # A red run is easy to stop hearing. The issue is what reaches a person;
      # see the script for why it comments only when something changed.
      - name: File, update or close the stale-series issue
        if: always() && steps.stale.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/stale-issue.sh status.txt status.jsonl

      # An acknowledgement lapses into a red run by design (ADR-0015); this
      # says so two weeks ahead, so the decision is made before the day.
      - name: File, update or close the ack-lapsing issue
        if: always() && steps.stale.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/lapse-issue.sh status.jsonl

      - name: Fail if any series has stopped advancing
        if: always() && steps.stale.outcome == 'success'
        run: hogcycle status --fail-on-stale > /dev/null
