[project]
name = "hogcycle"
version = "0.2.0"
description = "Bitemporal data warehouse for the China hog cycle (猪周期)"
requires-python = ">=3.11"
dependencies = [
    "akshare>=1.18",
    "duckdb>=1.0",
    "pyarrow>=16",
    "pyyaml>=6",
    "pytz",  # duckdb needs it to hand TIMESTAMPTZ back to Python
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
hogcycle = "hogcycle.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hogcycle"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 92
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "DTZ", "RUF"]
ignore = [
    "RUF001",  # ambiguous unicode in strings — this project is bilingual by nature
    "RUF002",
    "RUF003",
]
