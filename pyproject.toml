[project]
name = "hogcycle"
version = "0.1.0"
description = "Bitemporal data warehouse and dashboard for the China hog cycle (猪周期)"
requires-python = ">=3.11"
dependencies = [
    "akshare>=1.18",
    "duckdb>=1.0",
    "pyarrow>=16",
    "pyyaml>=6",
    "pytz",  # duckdb needs it to hand TIMESTAMPTZ back to Python
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
hogcycle = "hogcycle.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hogcycle"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
